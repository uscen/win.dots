# =============================================================================== #
# General:                                                                        #
# =============================================================================== #
[general]
live_config_reload = true
working_directory = "C:/Users/lli"

# =============================================================================== #
# Terminal:                                                                       #
# =============================================================================== #
[terminal.shell]
program = "elvish"

# =============================================================================== #
# Env:                                                                            #
# =============================================================================== #
[env]
TERM = "xterm-256color"

# =============================================================================== #
# Window:                                                                         #
# =============================================================================== #
[window]
decorations = "Full"
dynamic_title = true
dynamic_padding = true

[window.padding]
x = 0
y = 0

[window.dimensions]
columns = 0
lines = 0

# =============================================================================== #
# Fonts:                                                                          #
# =============================================================================== #
[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Bold" }
bold = { family = "JetBrainsMono Nerd Font", style = "ExtraBold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
offset = { x = 0, y = 1 }
glyph_offset = { x = 0, y = 1 }
size = 12
builtin_box_drawing = true

# =============================================================================== #
# Scrolling:                                                                      #
# =============================================================================== #
[scrolling]
history = 50000
multiplier = 3

# =============================================================================== #
# Cursor:                                                                         #
# =============================================================================== #
[cursor]
unfocused_hollow = true
thickness = 0.15
vi_mode_style = { shape = "Block", blinking = "Off" }

[cursor.style]
blinking = "Off"
shape = "Block"

# =============================================================================== #
# Mouse:                                                                          #
# =============================================================================== #
[mouse]
hide_when_typing = true

# =============================================================================== #
# Selection:                                                                      #
# =============================================================================== #
[selection]
save_to_clipboard = false

# =============================================================================== #
# Colorscheme:                                                                    #
# =============================================================================== #
[colors.primary]
background = '#172526'
foreground = '#DBD2C7'

[colors.cursor]
text = '#172526'
cursor = '#DBD2C7'

[colors.selection]
text = '#DBD2C7'
background = '#233935'

[colors.normal]
black = '#172526'
red = '#D2696C'
green = '#88B497'
yellow = '#FFD7AA'
blue = '#91C4C0'
magenta = '#F9ADA0'
cyan = '#87CBB1'
white = '#A1A790'

[colors.bright]
black = '#568270'
red = '#D2696C'
green = '#88B497'
yellow = '#FFD7AA'
blue = '#91C4C0'
magenta = '#F9ADA0'
cyan = '#87CBB1'
white = '#DBD2C7'

# =============================================================================== #
# Keybidings:                                                                     #
# =============================================================================== #
[keyboard]
bindings = [
  { key = "Return", mods = "Control|Shift", action = "SpawnNewInstance" },
  { key = "Space", mods ="Control|Shift",action = "ToggleViMode"},
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "Paste", action = "Paste" },
  { key = "Copy", action = "Copy" },
  { key = "Insert", mods = "Shift", action = "PasteSelection" },
  { key = "F", mods = "Control|Shift", action = "SearchForward", mode = "~Search" },
  { key = "B", mods = "Control|Shift", action = "SearchBackward", mode = "~Search" },
  { key = "Key0", mods = "Control", action = "ResetFontSize" },
  { key = "Equals", mods = "Control", action = "IncreaseFontSize" },
  { key = "Minus", mods = "Control", action = "DecreaseFontSize" },
  { key = "L", mods = "Control", action = "ClearLogNotice" },
  { key = "L", mods = "Control", chars = "\f" },
  { key = "PageUp", mods = "Shift", action = "ScrollPageUp", mode = "~Alt" },
  { key = "PageDown", mods = "Shift", action = "ScrollPageDown", mode = "~Alt" },
  { key = "Up", mods = "Shift", action = "ScrollLineUp", mode = "~Alt" },
  { key = "Down", mods = "Shift", action = "ScrollLineDown", mode = "~Alt" },
  { key = "Home", mods = "Shift", action = "ScrollToTop", mode = "~Alt" },
  { key = "End", mods = "Shift", action = "ScrollToBottom", mode = "~Alt" },
]
