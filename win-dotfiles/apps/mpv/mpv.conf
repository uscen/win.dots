# =============================================================================== #
# Tweaks:                                                                         #
# =============================================================================== #
speed=1
cache=yes
ontop=yes
fullscreen=yes
window-maximized=yes
prefetch-playlist=yes
snap-window=yes
taskbar-progress=yes
window-maximized=yes
save-position-on-quit=yes
keep-open=yes
keep-open-pause=yes
cursor-autohide-fs-only=yes
save-position-on-quit=yes
force-seekable=yes
title-bar=no
border=no
pause=no
profile=fast
reset-on-next-file=pause
force-window=immediate
cache-secs=1600
autofit-larger=90%x90%
geometry=50%:50%
cursor-autohide=300
demuxer-max-back-bytes=20M
demuxer-max-bytes=20M
term-status-msg="Time: ${time-pos}"
background-color='#172526'
watch-later-dir="~~/cache/watch_later"

# =============================================================================== #
# OSD:                                                                            #
# =============================================================================== #
no-border
osc=no
osd-font='JetBrainsMono NF'
osd-font-size=30
osd-bold=yes
osd-italic=no
osd-blur=0
osd-bar=yes
osd-bar-align-y = 1
osd-bar-w=100
osd-bar-h=1.25
osd-border-size=1
osd-bar-border-size=0.1
osd-back-color='#172526'
osd-border-color='#233935'

# =============================================================================== #
# Terminal:                                                                       #
# =============================================================================== #
msg-color=yes
msg-module=yes
term-osd-bar=yes
msg-level=osd=warn
term-osd-bar-chars='[━━ ]'

# =============================================================================== #
# Quality:                                                                        #
# =============================================================================== #
vo=gpu-next
gpu-api=vulkan
gpu-context=auto
hwdec=auto-safe
hwdec-codecs=h264,hevc
dither-depth=8
scale-antiring=0.6
hls-bitrate=max
vd-lavc-dr=yes

# =============================================================================== #
# Shaders:                                                                        #
# =============================================================================== #
scale=ewa_lanczossharp
dscale=mitchell
cscale=ewa_lanczossharp
gpu-shader-cache-dir='~~/shaders/cache'

# =============================================================================== #
# Debanding:                                                                      #
# =============================================================================== #
deband=no
deband-iterations=1
deband-threshold=48
deband-range=16
deband-grain=32

# =============================================================================== #
# Audio:                                                                          #
# =============================================================================== #
volume=100
audio-file-auto=fuzzy
volume-max=150
audio-pitch-correction=yes

# =============================================================================== #
# Languages:                                                                      #
# =============================================================================== #
vlang=en,eng
slang=eng,en,und,de,ger,jp,jap
alang=jpn,jp,eng,en,enUS,en-US,de,ger

# =============================================================================== #
# Subtitles:                                                                      #
# =============================================================================== #
sub-auto = all
sub-visibility=no
sub-fix-timing=yes
subs-with-matching-audio=yes
sub-bold = yes
sub-font='JetBrainsMono NF'
sub-font-size=30
sub-border-size=3
sub-color='#eceff4'
sub-back-color='#2e3440'
sub-shadow-color='#2e3440'
sub-border-color='#2e3440'
sub-outline-color='#2e3440'
sub-blur=0.5
sub-gauss=1.5
sub-scale=0.7
sub-margin-y=60
sub-shadow-offset=0
sub-outline-size=1.15
stretch-image-subs-to-screen=yes
track-auto-selection=yes

# =============================================================================== #
# Screenshoot:                                                                    #
# =============================================================================== #
screenshot-high-bit-depth = yes
screenshot-sw = no
screenshot-png-compression = 6
screenshot-format=png
screenshot-directory="~/Pictures/screenshots/mpv-screenshots"
screenshot-template="%f-%wH.%wM.%wS.%wT-#%#00n"

# =============================================================================== #
# Extensions:                                                                     #
# =============================================================================== #
[extension.gif]
profile-desc=GIF Image Format
loop-file=yes
cache=no
no-pause

[extension.png]
profile-desc=JPG Images Format
video-aspect-override=no
loop-file=yes

[extension.jpg]
profile-desc=PNG Images Format
profile=extension.png

[extension.jpeg]
profile-desc=JPEG Images Format
profile=extension.png

# =============================================================================== #
# Profiles:                                                                       #
# =============================================================================== #
[normal-on-1080p]
profile-cond=display_height == 1080
profile-desc="1920x1080 Hp Elitebook Screen"
video-aspect-override=16:9

[stretch-on-1200p]
profile-cond=display_height == 1200
profile-desc="1920x1200 Thinkpad T14 Gen 3 & Gen 4"
video-aspect-override=16:10

[WEB-DL]
profile-cond=string.match(p.filename, "HatSubs")~=nil or string.match(p.filename, "SubsPlease")~=nil or string.match(p.filename, "HorribleSubs")~=nil or string.match(p.filename, "Erai%-raws")~=nil
profile-desc="WEB-DL Anime (HatSubs, SubsPlease, HorribleSubs, Erai-raws)"
deband=yes
cache=no

[youtube]
profile-cond=path:find('youtu%.?be') ~= nil
profile-desc="youtube Internet Streams"
fullscreen=no
deband=yes
cache=no
